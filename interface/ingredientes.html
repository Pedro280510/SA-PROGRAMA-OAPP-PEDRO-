{% extends "base.html" %}
{% block conteudo %}
<h1>Ingredientes</h1>
<section class="bloco">
  <h2>Estoque</h2>
  {% for id, ing in f.ingredientes.items() %}
  <div class="linha-estoque">
    <div class="nome">{{ ing.nome }} {% if ing.estoque <= 10 %}<span class="selo">Estoque baixo</span>{% endif %}</div>
    <div class="barra {{ 'baixo' if ing.estoque <= 10 }}"><i style="--largura: {{ [ing.estoque * 2, 100]|min }}%"></i></div>
    <div class="qtd">{{ ing.estoque }} Kg</div>
  </div>
  {% endfor %}
</section>

<div class="duas-colunas">
  <section class="bloco">
    <h2>Repor estoque</h2>
    <form method="post" action="{{ url_for('ingredientes') }}">
      <label>Ingrediente
        <select name="id">{% for id, ing in f.ingredientes.items() %}<option value="{{ id }}">{{ ing.nome }}</option>{% endfor %}</select>
      </label>
      <label>Quilos recebidos<input type="number" name="quantidade" min="1" required></label>
      <label>Valor total pago (R$)<input type="text" name="custo" inputmode="decimal" placeholder="45,50" required></label>
      <button>Registrar compra</button>
    </form>
  </section>
  <section class="bloco">
    <h2>Cadastrar ingrediente</h2>
    <form method="post" action="{{ url_for('ingredientes') }}">
      <label>Nome<input type="text" name="nome" placeholder="Pistache (Kg)" required></label>
      <label>Estoque inicial (Kg)<input type="number" name="estoque" min="1" required></label>
      <button>Cadastrar ingrediente</button>
    </form>
  </section>
</div>
{% endblock %}
